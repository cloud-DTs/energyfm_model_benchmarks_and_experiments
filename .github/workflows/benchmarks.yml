name: Benchmark checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[cpu]"
      - run: python -m pip check
      - run: python -m energyfm benchmark --plan
      - run: python -m energyfm e1 --limit 2 --plan
      - run: python -m energyfm e2 compare --smoke --plan
      - run: python -m energyfm e3 replay --smoke --plan
